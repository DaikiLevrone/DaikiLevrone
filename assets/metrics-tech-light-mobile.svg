<svg width="430" height="1060" viewBox="0 0 430 1060" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mobile GitHub stats and technology stack for Fabricio Prado</title>
  <desc id="desc">Mobile visual panel with GitHub metrics and technologies used by Fabricio Prado.</desc>
  <style>
    .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #4E2FB0; letter-spacing: 0; }
    .subtitle { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #5B478E; }
    .section { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #4E2FB0; letter-spacing: 0; }
    .metric-label { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #5B478E; }
    .metric-value { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 34px; font-weight: 900; fill: #4E2FB0; letter-spacing: 0; }
    .metric-note { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #4E2FB0; }
    .group { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; font-weight: 700; fill: #4E2FB0; }
    .tech-small { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #4E2FB0; }
  </style>

  <defs>
    <linearGradient id="metrics-mobile-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7DFF7" stop-opacity="0.12" />
      <stop offset="48%" stop-color="#A48AE0" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.12;0.31;0.12" dur="7.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4E2FB0" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="metrics-mobile-light-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E2FB0" />
      <stop offset="45%" stop-color="#C6B4EE" />
      <stop offset="100%" stop-color="#7B5FD1" />
    </linearGradient>
    <filter id="metrics-mobile-light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4E2FB0" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="430" height="1060" fill="#E7DFF7" />
  <rect x="14" y="16" width="402" height="1028" rx="24" fill="url(#metrics-mobile-light-bg)" stroke="#C6B4EE" stroke-opacity="0.58" />
  <text x="28" y="62" class="title">operating.stack</text>
  <text x="28" y="91" class="subtitle">Readable stats + real technologies.</text>
  <text x="28" y="122" class="section">GitHub pulse</text>

    <g filter="url(#metrics-mobile-light-shadow)">
      <rect x="28" y="132" width="174" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="50" y="168" class="metric-label">Repos</text>
      <text x="50" y="214" class="metric-value">11</text>
      <text x="146" y="214" class="metric-note">public</text>
      <rect x="50" y="231" width="88" height="5" rx="2.5" fill="url(#metrics-mobile-light-bar)">
        <animate attributeName="width" values="36;88;68;88" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </g>
    <g filter="url(#metrics-mobile-light-shadow)">
      <rect x="228" y="132" width="174" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="250" y="168" class="metric-label">Contribs</text>
      <text x="250" y="214" class="metric-value">25</text>
      <text x="346" y="214" class="metric-note">year</text>
      <rect x="250" y="231" width="88" height="5" rx="2.5" fill="url(#metrics-mobile-light-bar)">
        <animate attributeName="width" values="36;88;68;88" dur="6.8s" repeatCount="indefinite" />
      </rect>
    </g>
    <g filter="url(#metrics-mobile-light-shadow)">
      <rect x="28" y="274" width="174" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="50" y="310" class="metric-label">Commits</text>
      <text x="50" y="356" class="metric-value">19</text>
      <text x="146" y="356" class="metric-note">tracked</text>
      <rect x="50" y="373" width="88" height="5" rx="2.5" fill="url(#metrics-mobile-light-bar)">
        <animate attributeName="width" values="36;88;68;88" dur="7.1s" repeatCount="indefinite" />
      </rect>
    </g>
    <g filter="url(#metrics-mobile-light-shadow)">
      <rect x="228" y="274" width="174" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="250" y="310" class="metric-label">Featured</text>
      <text x="250" y="356" class="metric-value">4</text>
      <text x="346" y="356" class="metric-note">systems</text>
      <rect x="250" y="373" width="77" height="5" rx="2.5" fill="url(#metrics-mobile-light-bar)">
        <animate attributeName="width" values="36;77;57;77" dur="7.4s" repeatCount="indefinite" />
      </rect>
    </g>
  <text x="28" y="438" class="section">Technologies</text>
