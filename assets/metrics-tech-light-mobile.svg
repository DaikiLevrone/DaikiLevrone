ext><rect x="28" y="668" width="82" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.27s" repeatCount="indefinite" /></rect><text x="43" y="688" class="tech-small">Python</text><rect x="118" y="668" width="78" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.38s" repeatCount="indefinite" /></rect><text x="133" y="688" class="tech-small">SQL</text><rect x="204" y="668" width="98" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.49s" repeatCount="indefinite" /></rect><text x="219" y="688" class="tech-small">Power BI</text><rect x="28" y="706" width="114" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.60s" repeatCount="indefinite" /></rect><text x="43" y="726" class="tech-small">PostgreSQL</text><text x="28" y="754" class="group">Backend</text><rect x="28" y="778" width="98" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.71s" repeatCount="indefinite" /></rect><text x="43" y="798" class="tech-small">Firebase</text><rect x="134" y="778" width="90" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.82s" repeatCount="indefinite" /></rect><text x="149" y="798" class="tech-small">Node.js</text><rect x="232" y="778" width="78" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.93s" repeatCount="indefinite" /></rect><text x="247" y="798" class="tech-small">C#</text><rect x="318" y="778" width="78" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.04s" repeatCount="indefinite" /></rect><text x="333" y="798" class="tech-small">.NET</text><rect x="28" y="816" width="78" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.15s" repeatCount="indefinite" /></rect><text x="43" y="836" class="tech-small">PHP</text><text x="28" y="864" class="group">Web Core</text><rect x="28" y="888" width="78" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.26s" repeatCount="indefinite" /></rect><text x="43" y="908" class="tech-small">HTML</text><rect x="114" y="888" width="78" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.37s" repeatCount="indefinite" /></rect><text x="129" y="908" class="tech-small">CSS</text><rect x="200" y="888" width="78" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.48s" repeatCount="indefinite" /></rect><text x="215" y="908" class="tech-small">Git</text><rect x="286" y="888" width="82" height="30" rx="15" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.59s" repeatCount="indefinite" /></rect><text x="301" y="908" class="tech-small">GitHub</text>
</svg>
