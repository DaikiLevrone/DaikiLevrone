text><rect x="28" y="668" width="86" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.27s" repeatCount="indefinite" /></rect><text x="44" y="689" class="tech-small">Python</text><rect x="122" y="668" width="82" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.38s" repeatCount="indefinite" /></rect><text x="138" y="689" class="tech-small">SQL</text><rect x="212" y="668" width="102" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.49s" repeatCount="indefinite" /></rect><text x="228" y="689" class="tech-small">Power BI</text><rect x="28" y="706" width="118" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.60s" repeatCount="indefinite" /></rect><text x="44" y="727" class="tech-small">PostgreSQL</text><text x="28" y="754" class="group">Backend</text><rect x="28" y="778" width="102" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.71s" repeatCount="indefinite" /></rect><text x="44" y="799" class="tech-small">Firebase</text><rect x="138" y="778" width="94" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.82s" repeatCount="indefinite" /></rect><text x="154" y="799" class="tech-small">Node.js</text><rect x="240" y="778" width="82" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.93s" repeatCount="indefinite" /></rect><text x="256" y="799" class="tech-small">C#</text><rect x="28" y="816" width="82" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.04s" repeatCount="indefinite" /></rect><text x="44" y="837" class="tech-small">.NET</text><rect x="118" y="816" width="82" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.15s" repeatCount="indefinite" /></rect><text x="134" y="837" class="tech-small">PHP</text><text x="28" y="864" class="group">Web Core</text><rect x="28" y="888" width="82" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.26s" repeatCount="indefinite" /></rect><text x="44" y="909" class="tech-small">HTML</text><rect x="118" y="888" width="82" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.37s" repeatCount="indefinite" /></rect><text x="134" y="909" class="tech-small">CSS</text><rect x="208" y="888" width="82" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.48s" repeatCount="indefinite" /></rect><text x="224" y="909" class="tech-small">Git</text><rect x="298" y="888" width="86" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.59s" repeatCount="indefinite" /></rect><text x="314" y="909" class="tech-small">GitHub</text>
</svg>
