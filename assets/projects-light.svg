<svg width="980" height="770" viewBox="0 0 980 770" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Featured projects by Fabricio Prado</title>
  <desc id="desc">Four selected public repositories with readable cards, verified repository links and a purple visual system.</desc>
  <style>
    .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 44px; font-weight: 800; fill: #4E2FB0; letter-spacing: 0; }
    .subtitle { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 17px; fill: #5B478E; }
    .name { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #4E2FB0; letter-spacing: 0; }
    .category { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; fill: #4E2FB0; }
    .body { font-family: Segoe UI, Arial, sans-serif; font-size: 17px; fill: #5B478E; }
    .chip { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #4E2FB0; }
    .link { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #4E2FB0; }
    .note { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #5B478E; }
  </style>

  <defs>
    <linearGradient id="projects-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7DFF7" stop-opacity="0.13" />
      <stop offset="52%" stop-color="#A48AE0" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.10;0.28;0.10" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4E2FB0" stop-opacity="0.26" />
    </linearGradient>
    <linearGradient id="projects-light-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E2FB0" />
      <stop offset="50%" stop-color="#C6B4EE" />
      <stop offset="100%" stop-color="#7B5FD1" />
    </linearGradient>
    <filter id="projects-light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4E2FB0" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="980" height="770" fill="#E7DFF7" />
  <rect x="18" y="18" width="944" height="734" rx="28" fill="url(#projects-light-bg)" stroke="#C6B4EE" stroke-opacity="0.58" />
  <text x="38" y="72" class="title">selected.systems</text>
  <text x="40" y="106" class="subtitle">Curated public implementation work. Generated language noise removed.</text>
  <rect x="736" y="44" width="194" height="38" rx="19" fill="#ECE5FA" stroke="#C6B4EE">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6s" repeatCount="indefinite" />
  </rect>
  <text x="760" y="68" class="subtitle">DaikiLevrone/repo</text>

  <g filter="url(#projects-light-shadow)">
    <rect x="38" y="136" width="444" height="260" rx="18" fill="#FFFFFF" stroke="url(#projects-light-stroke)" stroke-width="1.4" stroke-opacity="0.74">
      <animate attributeName="stroke-opacity" values="0.42;0.95;0.42" dur="7.5s" repeatCount="indefinite" />
    </rect>
    <rect x="38" y="136" width="444" height="72" rx="18" fill="#F1EBFB" />
    <rect x="38" y="190" width="444" height="18" fill="#F1EBFB" />
    <circle cx="65" cy="172" r="7" fill="#4E2FB0">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" repeatCount="indefinite" />
