    <text x="86" y="180" class="name">SistemaGuiasBoletas</text>
    <text x="64" y="215" class="category">Desktop automation</text>
    <text x="64" y="240" class="body">Windows desktop system that converts business</text><text x="64" y="262" class="body">TXT files into professional PDF guides and</text><text x="64" y="284" class="body">payslips, keeps local history, manages workers,</text><text x="64" y="306" class="body">sends SMTP email and opens WhatsApp Web handoff</text>
    <rect x="64" y="332" width="72" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="81" y="353" class="chip">C#</text><rect x="145" y="332" width="150" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="162" y="353" class="chip">Windows Forms</text><rect x="304" y="332" width="150" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="321" y="353" class="chip">.NET Framework 4.8</text>
    <text x="64" y="378" class="link">github.com/DaikiLevrone/SistemaGuiasBoletas</text>
    <rect x="64" y="388" width="72" height="3" rx="1.5" fill="#4E2FB0">
      <animate attributeName="x" values="64;384;64" dur="8.2s" repeatCount="indefinite" />
    </rect>
  </g>
  <g filter="url(#projects-light-shadow)">
    <rect x="520" y="136" width="444" height="260" rx="18" fill="#FFFFFF" stroke="url(#projects-light-stroke)" stroke-width="1.4" stroke-opacity="0.74">
      <animate attributeName="stroke-opacity" values="0.42;0.95;0.42" dur="7.9s" repeatCount="indefinite" />
    </rect>
    <rect x="520" y="136" width="444" height="72" rx="18" fill="#F1EBFB" />
    <rect x="520" y="190" width="444" height="18" fill="#F1EBFB" />
    <circle cx="547" cy="172" r="7" fill="#4E2FB0">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="5.0s" repeatCount="indefinite" />
    </circle>
    <text x="568" y="180" class="name">Enkarga</text>
    <text x="546" y="215" class="category">Business web portal</text>
    <text x="546" y="240" class="body">Operational web portal for a courier company,</text><text x="546" y="262" class="body">connecting customers, staff, transport, guide</text><text x="546" y="284" class="body">tracking, invoicing, deposits and accounting</text><text x="546" y="306" class="body">modules.</text>
    <rect x="546" y="332" width="72" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="563" y="353" class="chip">PHP</text><rect x="627" y="332" width="135" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="644" y="353" class="chip">JavaScript</text><rect x="771" y="332" width="75" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="788" y="353" class="chip">HTML</text><rect x="855" y="332" width="72" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="872" y="353" class="chip">CSS</text>
    <text x="546" y="378" class="link">github.com/DaikiLevrone/Enkarga</text>
    <rect x="546" y="388" width="72" height="3" rx="1.5" fill="#4E2FB0">
      <animate attributeName="x" values="546;866;546" dur="8.7s" repeatCount="indefinite" />
    </rect>
  </g>
  <g filter="url(#projects-light-shadow)">
    <rect x="38" y="436" width="444" height="260" rx="18" fill="#FFFFFF" stroke="url(#projects-light-stroke)" stroke-width="1.4" stroke-opacity="0.74">
      <animate attributeName="stroke-opacity" values="0.42;0.95;0.42" dur="8.3s" repeatCount="indefinite" />
    </rect>
    <rect x="38" y="436" width="444" height="72" rx="18" fill="#F1EBFB" />
    <rect x="38" y="490" width="444" height="18" fill="#F1EBFB" />
    <circle cx="65" cy="472" r="7" fill="#4E2FB0">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <text x="86" y="480" class="name">TRABAJO-FINAL-BPA</text>
    <text x="64" y="515" class="category">Data and ML app</text>
    <text x="64" y="540" class="body">Streamlit app that forecasts hotel occupancy in</text><text x="64" y="562" class="body">Peru by department and turns model output into</text><text x="64" y="584" class="body">travel-planning recommendations.</text>
    <rect x="64" y="632" width="95" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="81" y="653" class="chip">Python</text><rect x="168" y="632" width="125" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="185" y="653" class="chip">Streamlit</text><rect x="302" y="632" width="95" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="319" y="653" class="chip">Pandas</text>
    <text x="64" y="678" class="link">github.com/DaikiLevrone/TRABAJO-FINAL-BPA</text>
    <rect x="64" y="688" width="72" height="3" rx="1.5" fill="#4E2FB0">
      <animate attributeName="x" values="64;384;64" dur="9.2s" repeatCount="indefinite" />
    </rect>
  </g>
  <g filter="url(#projects-light-shadow)">
    <rect x="520" y="436" width="444" height="260" rx="18" fill="#FFFFFF" stroke="url(#projects-light-stroke)" stroke-width="1.4" stroke-opacity="0.74">
      <animate attributeName="stroke-opacity" values="0.42;0.95;0.42" dur="8.7s" repeatCount="indefinite" />
    </rect>
    <rect x="520" y="436" width="444" height="72" rx="18" fill="#F1EBFB" />
    <rect x="520" y="490" width="444" height="18" fill="#F1EBFB" />
    <circle cx="547" cy="472" r="7" fill="#4E2FB0">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="5.4s" repeatCount="indefinite" />
    </circle>
    <text x="568" y="480" class="name">Fitfat-Site-Web</text>
    <text x="546" y="515" class="category">Health and fitness web</text>
    <text x="546" y="540" class="body">Responsive fitness and nutrition website with</text><text x="546" y="562" class="body">registration, plan pages, password recovery</text><text x="546" y="584" class="body">flow, PHPMailer integration and structured</text><text x="546" y="606" class="body">content for food and training routines.</text>
    <rect x="546" y="632" width="75" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="563" y="653" class="chip">HTML</text><rect x="630" y="632" width="72" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="647" y="653" class="chip">CSS</text><rect x="711" y="632" width="135" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="728" y="653" class="chip">JavaScript</text><rect x="855" y="632" width="72" height="32" rx="16" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.62" /><text x="872" y="653" class="chip">PHP</text>
    <text x="546" y="678" class="link">github.com/DaikiLevrone/Fitfat-Site-Web</text>
    <rect x="546" y="688" width="72" height="3" rx="1.5" fill="#4E2FB0">
      <animate attributeName="x" values="546;866;546" dur="9.7s" repeatCount="indefinite" />
