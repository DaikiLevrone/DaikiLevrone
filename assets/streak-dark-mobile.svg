<svg width="430" height="280" viewBox="0 0 430 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution streak for DaikiLevrone</title>
  <desc id="desc">Contribution pulse summary for DaikiLevrone using a lavender and violet visual identity.</desc>
  <style>
    .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #E7DFF7; letter-spacing: 0; }
    .subtitle { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #C6B4EE; }
    .streak-label { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #C6B4EE; }
    .streak-value { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 25px; font-weight: 900; fill: #E7DFF7; letter-spacing: 0; }
    .streak-note { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #C6B4EE; }
  </style>

  <defs>
    <linearGradient id="streak-mobile-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7DFF7" stop-opacity="0.12" />
      <stop offset="48%" stop-color="#A48AE0" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.12;0.31;0.12" dur="7.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4E2FB0" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="streak-mobile-dark-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E2FB0" />
      <stop offset="45%" stop-color="#C6B4EE" />
      <stop offset="100%" stop-color="#7B5FD1" />
    </linearGradient>
    <filter id="streak-mobile-dark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#C6B4EE" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="430" height="280" fill="#110927" />
  <rect x="14" y="16" width="402" height="248" rx="24" fill="url(#streak-mobile-dark-bg)" stroke="#7B5FD1" stroke-opacity="0.58" />
  <text x="28" y="57" class="title">contribution.pulse</text>
  <text x="28" y="80" class="subtitle">Public GitHub activity, refreshed by workflow.</text>
  <rect x="28" y="92" width="374" height="44" rx="16" fill="#211347" stroke="#7B5FD1" stroke-opacity="0.62" /><text x="46" y="119" class="streak-label">current streak</text><text x="286" y="123" class="streak-value">1</text><text x="344" y="123" class="streak-note">day</text><rect x="28" y="150" width="374" height="44" rx="16" fill="#211347" stroke="#7B5FD1" stroke-opacity="0.62" /><text x="46" y="177" class="streak-label">contribs</text><text x="286" y="181" class="streak-value">25</text><text x="344" y="181" class="streak-note">calendar</text><rect x="28" y="208" width="374" height="44" rx="16" fill="#211347" stroke="#7B5FD1" stroke-opacity="0.62" /><text x="46" y="235" class="streak-label">created repos</text><text x="286" y="239" class="streak-value">6</text><text x="344" y="239" class="streak-note">total</text>
  <rect x="28" y="246" width="160" height="4" rx="2" fill="url(#streak-mobile-dark-bar)">
    <animate attributeName="width" values="70;160;110;160" dur="7s" repeatCount="indefinite" />
  </rect>
</svg>
