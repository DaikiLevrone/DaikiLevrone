<svg width="430" height="1670" viewBox="0 0 430 1670" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Featured mobile projects by Fabricio Prado</title>
  <desc id="desc">Mobile stacked cards for four selected public repositories by Fabricio Prado.</desc>
  <style>
    .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 35px; font-weight: 850; fill: #4E2FB0; letter-spacing: 0; }
    .subtitle { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #5B478E; }
    .name { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 850; fill: #4E2FB0; letter-spacing: 0; }
    .category { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #4E2FB0; }
    .body { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; fill: #5B478E; }
    .chip-mobile { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #4E2FB0; }
    .link { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #4E2FB0; }
  </style>

  <defs>
    <linearGradient id="projects-mobile-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7DFF7" stop-opacity="0.13" />
      <stop offset="52%" stop-color="#A48AE0" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.10;0.28;0.10" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4E2FB0" stop-opacity="0.26" />
    </linearGradient>
    <linearGradient id="projects-mobile-light-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E2FB0" />
      <stop offset="50%" stop-color="#C6B4EE" />
      <stop offset="100%" stop-color="#7B5FD1" />
    </linearGradient>
    <filter id="projects-mobile-light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4E2FB0" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="430" height="1670" fill="#E7DFF7" />
  <rect x="14" y="16" width="402" height="1638" rx="26" fill="url(#projects-mobile-light-bg)" stroke="#C6B4EE" stroke-opacity="0.62" />
  <text x="22" y="66" class="title">selected.systems</text>
  <text x="24" y="100" class="subtitle">Real public repositories, readable on mobile.</text>

  <g filter="url(#projects-mobile-light-shadow)">
    <rect x="22" y="128" width="386" height="336" rx="18" fill="#FFFFFF" stroke="url(#projects-mobile-light-stroke)" stroke-width="1.3" stroke-opacity="0.76">
      <animate attributeName="stroke-opacity" values="0.46;1;0.46" dur="7.5s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="128" width="386" height="78" rx="18" fill="#F1EBFB" />
    <rect x="22" y="186" width="386" height="20" fill="#F1EBFB" />
    <text x="44" y="175" class="name">SistemaGuiasBoletas</text>
    <text x="44" y="219" class="category">Desktop automation</text>
    <text x="44" y="240" class="body">Windows desktop system that converts</text><text x="44" y="264" class="body">business TXT files into professional</text><text x="44" y="288" class="body">PDF guides and payslips, keeps local</text><text x="44" y="312" class="body">history, manages workers, sends SMTP</text><text x="44" y="336" class="body">email and opens WhatsApp Web handoff</text><text x="44" y="360" class="body">links.</text>
    <rect x="44" y="382" width="86" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="62" y="406" class="chip-mobile">C#</text><rect x="141" y="382" width="168" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="159" y="406" class="chip-mobile">Windows Forms</text>
    <text x="44" y="444" class="link">github.com/DaikiLevrone/SistemaGuiasBoletas</text>
  </g>
  <g filter="url(#projects-mobile-light-shadow)">
    <rect x="22" y="500" width="386" height="336" rx="18" fill="#FFFFFF" stroke="url(#projects-mobile-light-stroke)" stroke-width="1.3" stroke-opacity="0.76">
      <animate attributeName="stroke-opacity" values="0.46;1;0.46" dur="7.9s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="500" width="386" height="78" rx="18" fill="#F1EBFB" />
    <rect x="22" y="558" width="386" height="20" fill="#F1EBFB" />
    <text x="44" y="547" class="name">Enkarga</text>
    <text x="44" y="591" class="category">Business web portal</text>
    <text x="44" y="612" class="body">Operational web portal for a courier</text><text x="44" y="636" class="body">company, connecting customers,</text><text x="44" y="660" class="body">staff, transport, guide tracking,</text><text x="44" y="684" class="body">invoicing, deposits and accounting</text><text x="44" y="708" class="body">modules.</text>
    <rect x="44" y="754" width="86" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="62" y="778" class="chip-mobile">PHP</text><rect x="141" y="754" width="144" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="159" y="778" class="chip-mobile">JavaScript</text><rect x="296" y="754" width="86" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="314" y="778" class="chip-mobile">HTML</text>
    <text x="44" y="816" class="link">github.com/DaikiLevrone/Enkarga</text>
  </g>
  <g filter="url(#projects-mobile-light-shadow)">
    <rect x="22" y="872" width="386" height="336" rx="18" fill="#FFFFFF" stroke="url(#projects-mobile-light-stroke)" stroke-width="1.3" stroke-opacity="0.76">
      <animate attributeName="stroke-opacity" values="0.46;1;0.46" dur="8.3s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="872" width="386" height="78" rx="18" fill="#F1EBFB" />
    <rect x="22" y="930" width="386" height="20" fill="#F1EBFB" />
    <text x="44" y="919" class="name">TRABAJO-FINAL-BPA</text>
    <text x="44" y="963" class="category">Data and ML app</text>
    <text x="44" y="984" class="body">Streamlit app that forecasts hotel</text><text x="44" y="1008" class="body">occupancy in Peru by department and</text><text x="44" y="1032" class="body">turns model output into</text><text x="44" y="1056" class="body">travel-planning recommendations.</text>
    <rect x="44" y="1126" width="104" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="62" y="1150" class="chip-mobile">Python</text><rect x="159" y="1126" width="134" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="177" y="1150" class="chip-mobile">Streamlit</text>
    <text x="44" y="1188" class="link">github.com/DaikiLevrone/TRABAJO-FINAL-BPA</text>
  </g>
  <g filter="url(#projects-mobile-light-shadow)">
    <rect x="22" y="1244" width="386" height="336" rx="18" fill="#FFFFFF" stroke="url(#projects-mobile-light-stroke)" stroke-width="1.3" stroke-opacity="0.76">
      <animate attributeName="stroke-opacity" values="0.46;1;0.46" dur="8.7s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="1244" width="386" height="78" rx="18" fill="#F1EBFB" />
    <rect x="22" y="1302" width="386" height="20" fill="#F1EBFB" />
    <text x="44" y="1291" class="name">Fitfat-Site-Web</text>
    <text x="44" y="1335" class="category">Health and fitness web</text>
    <text x="44" y="1356" class="body">Responsive fitness and nutrition</text><text x="44" y="1380" class="body">website with registration, plan</text><text x="44" y="1404" class="body">pages, password recovery flow,</text><text x="44" y="1428" class="body">PHPMailer integration and structured</text><text x="44" y="1452" class="body">content for food and training</text><text x="44" y="1476" class="body">routines.</text>
    <rect x="44" y="1498" width="86" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="62" y="1522" class="chip-mobile">HTML</text><rect x="141" y="1498" width="86" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="159" y="1522" class="chip-mobile">CSS</text><rect x="238" y="1498" width="144" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68" /><text x="256" y="1522" class="chip-mobile">JavaScript</text>
    <text x="44" y="1560" class="link">github.com/DaikiLevrone/Fitfat-Site-Web</text>
  </g>
</svg>
