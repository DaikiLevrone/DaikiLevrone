<svg width="980" height="840" viewBox="0 0 980 840" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub stats and professional technology stack for Fabricio Prado</title>
  <desc id="desc">A two column visual panel with public GitHub metrics and technologies used by Fabricio Prado, excluding auxiliary generated languages.</desc>
  <style>
    .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 44px; font-weight: 850; fill: #4E2FB0; letter-spacing: 0; }
    .subtitle { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 18px; fill: #5B478E; }
    .section { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 29px; font-weight: 850; fill: #4E2FB0; letter-spacing: 0; }
    .metric-label { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 17px; fill: #5B478E; }
    .metric-value { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 54px; font-weight: 900; fill: #4E2FB0; letter-spacing: 0; }
    .metric-note { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; fill: #4E2FB0; }
    .group { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 19px; font-weight: 700; fill: #4E2FB0; }
    .tech { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 16px; fill: #4E2FB0; }
  </style>

  <defs>
    <linearGradient id="metrics-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7DFF7" stop-opacity="0.12" />
      <stop offset="48%" stop-color="#A48AE0" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.12;0.31;0.12" dur="7.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4E2FB0" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="metrics-light-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E2FB0" />
      <stop offset="45%" stop-color="#C6B4EE" />
      <stop offset="100%" stop-color="#7B5FD1" />
    </linearGradient>
    <filter id="metrics-light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4E2FB0" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="980" height="840" fill="#E7DFF7" />
  <rect x="18" y="18" width="944" height="804" rx="30" fill="url(#metrics-light-bg)" stroke="#C6B4EE" stroke-opacity="0.62" />
  <path d="M70 794H410" stroke="url(#metrics-light-bar)" stroke-width="5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="80 280;210 150;80 280" dur="9s" repeatCount="indefinite" />
  </path>
  <text x="44" y="75" class="title">operating.stack</text>
  <text x="44" y="112" class="subtitle">Readable stats and real technologies, with generated language noise removed.</text>
  <text x="44" y="144" class="section">GitHub pulse</text>
  <text x="566" y="144" class="section">Technologies</text>

    <g filter="url(#metrics-light-shadow)">
