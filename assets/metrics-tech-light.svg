        <animate attributeName="width" values="36;88;68;88" dur="7.1s" repeatCount="indefinite" />
      </rect>
    </g>
    <g filter="url(#metrics-light-shadow)">
      <rect x="292" y="326" width="224" height="142" rx="20" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.72">
        <animate attributeName="stroke-opacity" values="0.46;0.9;0.46" dur="6.75s" repeatCount="indefinite" />
      </rect>
