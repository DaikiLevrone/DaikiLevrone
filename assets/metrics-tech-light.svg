      <text x="434" y="420" class="metric-note">systems</text>
      <rect x="316" y="442" width="77" height="6" rx="3" fill="url(#metrics-light-bar)">
        <animate attributeName="width" values="36;77;57;77" dur="7.4s" repeatCount="indefinite" />
      </rect>
    </g>
