<svg width="980" height="700" viewBox="0 0 980 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub stats and professional technology stack for Fabricio Prado</title>
  <desc id="desc">A two column visual panel with public GitHub metrics and technologies used by Fabricio Prado, excluding auxiliary generated languages.</desc>
  <style>
    .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #4E2FB0; letter-spacing: 0; }
    .subtitle { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 16px; fill: #5B478E; }
    .section { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #4E2FB0; letter-spacing: 0; }
    .metric-label { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; fill: #5B478E; }
    .metric-value { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 900; fill: #4E2FB0; letter-spacing: 0; }
    .metric-note { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #4E2FB0; }
    .group { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 17px; font-weight: 700; fill: #4E2FB0; }
    .tech { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; fill: #4E2FB0; }
  </style>

  <defs>
    <linearGradient id="metrics-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7DFF7" stop-opacity="0.12" />
      <stop offset="48%" stop-color="#A48AE0" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.12;0.31;0.12" dur="7.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4E2FB0" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="metrics-light-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E2FB0" />
      <stop offset="45%" stop-color="#C6B4EE" />
      <stop offset="100%" stop-color="#7B5FD1" />
    </linearGradient>
    <filter id="metrics-light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4E2FB0" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="980" height="700" fill="#E7DFF7" />
  <rect x="18" y="18" width="944" height="664" rx="28" fill="url(#metrics-light-bg)" stroke="#C6B4EE" stroke-opacity="0.58" />
  <text x="42" y="68" class="title">operating.stack</text>
  <text x="42" y="101" class="subtitle">Stats and real technologies, with auxiliary language noise removed.</text>
  <text x="42" y="130" class="section">GitHub pulse</text>
  <text x="536" y="130" class="section">Technologies</text>

    <g filter="url(#metrics-light-shadow)">
      <rect x="42" y="138" width="202" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="64" y="174" class="metric-label">Public repos</text>
      <text x="64" y="220" class="metric-value">11</text>
      <text x="160" y="220" class="metric-note">active</text>
      <rect x="64" y="237" width="88" height="5" rx="2.5" fill="url(#metrics-light-bar)">
        <animate attributeName="width" values="36;88;68;88" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </g>
    <g filter="url(#metrics-light-shadow)">
      <rect x="264" y="138" width="202" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="286" y="174" class="metric-label">Contributions</text>
      <text x="286" y="220" class="metric-value">25</text>
      <text x="382" y="220" class="metric-note">calendar</text>
      <rect x="286" y="237" width="88" height="5" rx="2.5" fill="url(#metrics-light-bar)">
        <animate attributeName="width" values="36;88;68;88" dur="6.8s" repeatCount="indefinite" />
      </rect>
    </g>
    <g filter="url(#metrics-light-shadow)">
      <rect x="42" y="282" width="202" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="64" y="318" class="metric-label">Commits</text>
      <text x="64" y="364" class="metric-value">19</text>
      <text x="160" y="364" class="metric-note">tracked</text>
      <rect x="64" y="381" width="88" height="5" rx="2.5" fill="url(#metrics-light-bar)">
        <animate attributeName="width" values="36;88;68;88" dur="7.1s" repeatCount="indefinite" />
      </rect>
    </g>
    <g filter="url(#metrics-light-shadow)">
      <rect x="264" y="282" width="202" height="122" rx="18" fill="#FFFFFF" stroke="#C6B4EE" stroke-opacity="0.64" />
      <text x="286" y="318" class="metric-label">Featured</text>
      <text x="286" y="364" class="metric-value">4</text>
      <text x="382" y="364" class="metric-note">systems</text>
      <rect x="286" y="381" width="77" height="5" rx="2.5" fill="url(#metrics-light-bar)">
        <animate attributeName="width" values="36;77;57;77" dur="7.4s" repeatCount="indefinite" />
      </rect>
    </g>
  <text x="536" y="166" class="group">Frontend</text><rect x="536" y="190" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="5.50s" repeatCount="indefinite" /></rect><text x="555" y="214" class="tech">React</text><rect x="639" y="190" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="5.61s" repeatCount="indefinite" /></rect><text x="658" y="214" class="tech">Vite</text><rect x="742" y="190" width="142" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="5.72s" repeatCount="indefinite" /></rect><text x="761" y="214" class="tech">TypeScript</text><rect x="536" y="234" width="142" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="5.83s" repeatCount="indefinite" /></rect><text x="555" y="258" class="tech">JavaScript</text><rect x="687" y="234" width="122" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="5.94s" repeatCount="indefinite" /></rect><text x="706" y="258" class="tech">Tailwind</text><rect x="536" y="278" width="172" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.05s" repeatCount="indefinite" /></rect><text x="555" y="302" class="tech">Framer Motion</text><rect x="717" y="278" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.16s" repeatCount="indefinite" /></rect><text x="736" y="302" class="tech">GSAP</text><text x="536" y="332" class="group">Data</text><rect x="536" y="356" width="102" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.27s" repeatCount="indefinite" /></rect><text x="555" y="380" class="tech">Python</text><rect x="647" y="356" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.38s" repeatCount="indefinite" /></rect><text x="666" y="380" class="tech">SQL</text><rect x="750" y="356" width="122" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.49s" repeatCount="indefinite" /></rect><text x="769" y="380" class="tech">Power BI</text><rect x="536" y="400" width="142" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.60s" repeatCount="indefinite" /></rect><text x="555" y="424" class="tech">PostgreSQL</text><text x="536" y="454" class="group">Backend</text><rect x="536" y="478" width="122" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.71s" repeatCount="indefinite" /></rect><text x="555" y="502" class="tech">Firebase</text><rect x="667" y="478" width="112" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.82s" repeatCount="indefinite" /></rect><text x="686" y="502" class="tech">Node.js</text><rect x="788" y="478" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="6.93s" repeatCount="indefinite" /></rect><text x="807" y="502" class="tech">C#</text><rect x="536" y="522" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.04s" repeatCount="indefinite" /></rect><text x="555" y="546" class="tech">.NET</text><rect x="639" y="522" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.15s" repeatCount="indefinite" /></rect><text x="658" y="546" class="tech">PHP</text><text x="536" y="576" class="group">Web Core</text><rect x="536" y="600" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.26s" repeatCount="indefinite" /></rect><text x="555" y="624" class="tech">HTML</text><rect x="639" y="600" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.37s" repeatCount="indefinite" /></rect><text x="658" y="624" class="tech">CSS</text><rect x="742" y="600" width="94" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.48s" repeatCount="indefinite" /></rect><text x="761" y="624" class="tech">Git</text><rect x="536" y="644" width="102" height="36" rx="18" fill="#ECE5FA" stroke="#C6B4EE" stroke-opacity="0.68"><animate attributeName="stroke-opacity" values="0.38;0.95;0.38" dur="7.59s" repeatCount="indefinite" /></rect><text x="555" y="668" class="tech">GitHub</text>
</svg>
